<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F0">
<title>Russo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23B23A33'/%3E%3Ctext x='12' y='16.5' font-size='12' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23F2E6C9'%3Eру%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&subset=cyrillic&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<style>
/* Layout: a single study column (max 760px); top bar with level chips and three tabs; topic and card views replace the list */
:root{
  --bg:#F3F5F0; --panel:#FFFFFF; --line:#DDE3DA; --fg:#1B2421; --muted:#5E6B66;
  --accent:#A8352E; --accent-soft:#F6E2DF; --on-accent:#FFFFFF; --lemon:#E2B33C; --lemon-soft:#F8EDCF;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --bad:#C2413A; --bad-soft:#FBE6E4;
  --shadow:0 1px 2px rgb(27 36 33 / .06),0 8px 24px rgb(27 36 33 / .07);
  --ui:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --it:"Literata", Georgia, "Times New Roman", serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614; --panel:#1A201D; --line:#2B3430; --fg:#E7ECE8; --muted:#9AA8A1;
  --accent:#F08C7F; --accent-soft:#3A2220; --on-accent:#1E0E0C; --lemon:#E8C547; --lemon-soft:#3A3318;
  --ok:#6CCB91; --ok-soft:#1B3326; --bad:#FF8B80; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .3);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--ui);-webkit-text-size-adjust:100%;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;text-decoration:none;color:var(--fg)}
.mascot{display:inline-block;width:54px;height:43px;flex:none;align-self:center}
.mascot svg{width:100%;height:100%;display:block}
.mwrap{position:relative;display:inline-flex;align-self:center}
.bubble{position:absolute;left:40px;top:-14px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:3px 9px;font:800 12px/1.3 var(--ui);white-space:nowrap;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:.3s;pointer-events:none;z-index:2}
.bubble.show{opacity:1;transform:none}
#pet{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-start;gap:0;z-index:25;pointer-events:none;opacity:0;transform:translateY(30px) scale(.8);transition:.35s cubic-bezier(.3,1.5,.6,1)}
#pet.show{opacity:1;transform:none}
#pet .mascot{width:110px;height:88px}
#pet .bubble{position:static;opacity:1;transform:none;font-size:15px;margin-top:4px}
@media (prefers-reduced-motion:reduce){#pet{transition:opacity .2s;transform:none}}
.win{display:flex;align-items:flex-start;gap:4px}
.win .bubble{position:static;opacity:1;transform:none;margin-top:4px;font-size:14px}
.mascot.big{width:96px;height:77px}
@media (prefers-reduced-motion:no-preference){.mascot.big{animation:hop .6s ease-out 2}@keyframes hop{50%{transform:translateY(-10px)}}}
.brand b{font:800 26px/1 var(--ui);letter-spacing:-.03em}
.brand i{font:italic 500 17px/1 var(--it);color:var(--muted)}
.stat{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.stat span b{color:var(--fg)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.err{background:var(--bad)}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.lv small{font-weight:500;color:var(--muted);font-size:12px}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lv[aria-pressed="true"] small{color:inherit;opacity:.8}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--on-accent);cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.lv:focus-visible,.tab:focus-visible,.topic:focus-visible,.opt:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.topic:hover{border-color:var(--accent)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.topic .tt{flex:1;min-width:0;font-weight:700}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.badge.part{background:var(--lemon-soft);color:var(--fg)}
.back{border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;padding:0;align-self:flex-start;font-size:14px}
h2{margin:0;font:800 28px/1.15 var(--ui);letter-spacing:-.02em;text-wrap:balance}
h3{margin:8px 0 0;font:800 13px/1 var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 20px}
.rule p{max-width:68ch}
.rule i[lang="ru"],.it{font-family:var(--it);font-style:italic;background:var(--lemon-soft);padding:0 3px;border-radius:3px;font-size:1.03em}
.rule table i[lang="ru"]{background:none;padding:0}
.tablewrap{overflow-x:auto;margin:12px 0}
.rule table{border-collapse:collapse;font-size:14px;min-width:100%}
.rule th,.rule td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.rule th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rule td{font-family:var(--it)}
.exs{display:flex;flex-direction:column;gap:10px;counter-reset:q}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ex.ok{border-color:var(--ok);background:var(--ok-soft)}
.ex.bad{border-color:var(--bad);background:var(--bad-soft)}
.q{font-family:var(--it);font-size:18px;line-height:1.4}
.q .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--muted);margin:0 3px}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans input{flex:1 1 200px;min-width:0;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--it)}
.ans input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:var(--it);font-size:16px}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{font-size:14px}
.fb b{font-family:var(--it);font-weight:600}
.fb .rulebtn{margin-top:8px;padding:7px 12px;font-size:13px}
.ans .idk{padding:9px 12px;font-size:14px}
.sheet>div.rulebox{width:min(700px,100%);max-height:86vh;overflow:auto}
.rulebox .rule{padding:4px 16px}
.score{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score strong{font:800 32px/1 var(--ui);font-variant-numeric:tabular-nums}
.score span{color:var(--muted);flex:1;min-width:160px}

/* cards */
.deck{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.deck .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nums{display:flex;gap:18px;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column}
.nums b{font:800 28px/1 var(--ui);font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.card{position:relative;min-height:260px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 20px;text-align:center;cursor:pointer;user-select:none}
.card .front{font:500 34px/1.2 var(--it);overflow-wrap:anywhere}
.card .tr{font:600 22px/1.3 var(--ui);color:var(--accent);overflow-wrap:anywhere}
.card .hint{font-size:13px;color:var(--muted)}
.card .say{position:absolute;right:12px;top:12px}
.boxes{position:absolute;left:14px;top:14px;display:flex;gap:3px}
.boxes i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.boxes i.on{background:var(--accent)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .btn{padding:14px}
.grade .no{background:var(--bad)}
.progressbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.w b{font:500 16px/1.3 var(--it);overflow-wrap:anywhere}
.w span{font-size:13px;color:var(--muted)}
.w.learned{border-color:var(--ok)}
.sheet{position:fixed;inset:0;background:rgb(10 14 12 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet>div{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sheet h4{margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.sheet input{font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px;text-decoration:none}
.rsec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.rsec h2{font-size:22px}
.build{display:flex;flex-direction:column;gap:10px}
.build .line{min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.build .line:empty::before{content:attr(data-ph);color:var(--muted);font-size:14px;padding:4px 6px}
.build .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;font:500 17px/1.2 var(--it)}
.line .chip{background:var(--accent-soft);border-color:var(--accent)}
.chip:disabled{cursor:default}
.topic.locked{opacity:.55}
.topic.locked .num{background:var(--line);color:var(--muted)}
.badge.pass{background:var(--ok);color:#fff}
.tracker{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;margin-bottom:14px;flex-wrap:wrap}
.tracker .progressbar{flex:1 1 120px;min-width:100px}
.tlv{font-size:14px}
.tpc{font-size:14px;font-variant-numeric:tabular-nums}
.tmsg{font-size:13px;color:var(--muted);font-weight:700}
.rlang{align-self:flex-start}
.testbox{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.testbox p{margin:0}
.tcat{margin:10px 0 0;font-size:20px}
.more{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.more>summary{cursor:pointer;list-style:none;padding:12px 18px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸";transition:transform .2s}
.more[open]>summary::before{transform:rotate(90deg)}
.more>summary small{font-weight:600;color:var(--muted)}
.more .rule{border:0;border-top:1px solid var(--line);border-radius:0}
.rule h4{margin:16px 0 4px;font-size:15px}
.rule .warn{background:var(--bad-soft);border-radius:10px;padding:8px 12px}
.rule .tip{background:var(--ok-soft);border-radius:10px;padding:8px 12px}
.tbl{padding:4px 0 2px}
.tbl .tablewrap{margin:0}
.tbl table{font-size:15px}
.tbl th[scope="row"]{font:700 13px/1.3 var(--ui);color:var(--fg);text-transform:none;letter-spacing:0;position:sticky;left:0;background:var(--panel);white-space:nowrap}
.tbl tr:nth-child(even) td,.tbl tr:nth-child(even) th[scope="row"]{background:var(--bg)}
.tbl td b{color:var(--accent);font-weight:700}
.tbl th,.tbl td{padding:8px 12px;vertical-align:middle}
.dtools{display:flex;gap:8px;flex-wrap:wrap}
.dtools input{flex:1 1 220px;min-width:0;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.dtools input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.dgroup{display:flex;flex-direction:column;gap:6px}
.dlist{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dw{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.dw:last-child{border-bottom:0}
.dw:nth-child(even){background:var(--bg)}
.dw b{font:500 17px/1.3 var(--it);overflow-wrap:anywhere}
.dw span{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.dw .say{position:static;height:30px;padding:0 6px}
.dcount{font-size:13px;color:var(--muted)}
@media (max-width:520px){.dw{grid-template-columns:32px 1fr}.dw span{grid-column:2}}
.tnote{margin:10px 16px 12px;font-size:14px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard b{font-size:16px}
.tcard i{font-family:var(--it);color:var(--muted)}
.tcard .badge{align-self:flex-start;margin-top:6px}
.reading{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.reading .it-text{font:400 18px/1.65 var(--it);white-space:pre-line}
.reading .ru-text{color:var(--muted);white-space:pre-line;border-top:1px dashed var(--line);padding-top:10px}
.reading .row{display:flex;gap:8px;flex-wrap:wrap}
.phr{display:flex;flex-direction:column;gap:6px}
.phr div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.phr b{font:500 16px/1.35 var(--it);flex:1;min-width:0}
.phr span{color:var(--muted);font-size:14px;flex:1;min-width:0}
@media (max-width:520px){.phr div{flex-wrap:wrap}.phr span{flex-basis:100%}}
.decksel{font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);max-width:100%}
.lvtag{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.home{font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px}
.home:hover{color:var(--fg)}
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/7;max-width:100%;border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:100%}
.hero figcaption{position:absolute;left:12px;bottom:10px;background:rgb(20 24 22 / .62);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.tcard{padding:0;overflow:hidden}
.tcard .pic{aspect-ratio:16/9;display:block;border-bottom:1px solid var(--line)}
.tcard .pic svg{display:block;width:100%;height:100%}
.tcard .tbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){h2{font-size:23px}.card .front{font-size:28px}.stat{width:100%;order:3}}
@media (prefers-reduced-motion:reduce){#toast,.progressbar i{transition:none}}

.kb{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;width:100%;margin-top:2px}
.kb button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 0;font:500 17px/1 var(--it);cursor:pointer;min-width:0;touch-action:manipulation}
.kb button:active{background:var(--accent-soft)}
.kb .wide{grid-column:span 2;font-family:var(--ui);font-size:13px;font-weight:700}
.kbbtn{padding:9px 10px;font-size:14px}
.kbbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:520px){.kb{gap:3px}.kb button{padding:9px 0;font-size:16px}}
body:has(#nl-badge-frame){padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="home" href="index.html" title="Torna a Vatman">← Vatman</a>
    <a class="brand" href="russo.html"><span class="mwrap"><span class="mascot" id="mascot"></span><span class="bubble" id="mbub"></span></span><b>Русский</b><i>il russo passo dopo passo</i></a>
    <div class="stat" id="stat"></div>
    <button class="icon" id="syncBtn" type="button" title="I progressi su un altro dispositivo"><span class="dot" id="syncDot"></span>Sincronizza</button>
  </header>
  <nav class="levels" id="levels" aria-label="Livello"></nav>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="gram" aria-selected="true">Grammatica</button>

{const bb=document.getElementById('mbub');bb.textContent=PRAISE[0];document.getElementById('mascot').closest('.mwrap').addEventListener('mouseenter',()=>{bb.textContent=praise();bb.classList.add('show');setTimeout(()=>bb.classList.remove('show'),2500)})}
const DAY=864e5,today=()=>new Date().toISOString().slice(0,10);

/* ============ progress & sync ============ */
let P=LS.get('rus.progress',null)||{v:1,updated:0,level:'A1',topics:{},cards:{},dir:'it',streak:{day:'',n:0}};

let KEY=LS.get('rus.key',null);
const hk=(location.hash.match(/^#sync-([a-z0-9]{16,64})$/)||[])[1];
if(hk&&hk!==KEY){KEY=hk;LS.set('rus.key',KEY);P.updated=0}
if(hk)history.replaceState(null,'',location.pathname);

function setDot(s){$('#syncDot').className='dot'+(s==='ok'?' ok':s==='err'?' err':'')}
async function pull(){
  if(!sb){setDot('err');return}
  try{
    await sb.rpc('create_board',{p_id:KEY,p_name:'Russo: progressi'}).then(()=>{},()=>{});
    const r=await sb.rpc('load_items',{p_board:KEY});
    if(r.error)throw r.error;
    const it=(r.data||[]).find(x=>x&&x.id==='progress');
    if(it&&it.p&&(it.p.updated||0)>(P.updated||0)){P=it.p;P.topics=P.topics||{};P.cards=P.cards||{};LS.set('rus.progress',P);render()}
    else if((P.updated||0)>((it&&it.p&&it.p.updated)||0))push();
    setDot('ok');
  }catch(e){console.error(e);setDot('err')}
}
let pushT;
function save(){
  P.updated=Date.now();
  const d=today();if(P.streak.day!==d){const y=new Date(Date.now()-DAY).toISOString().slice(0,10);P.streak={day:d,n:P.streak.day===y?P.streak.n+1:1}}

}

/* ============ helpers ============ */
const lvl=()=>LEVELS.find(l=>l.id===P.level)||LEVELS[0];

const MORE=ITA.more||{};
P.passed=P.passed||{};

const GATE=!!ITA.gate,PASS=0.75;
function isOpen(id){if(!GATE)return true;const i=ORDER.findIndex(t=>t.id===id);if(i<=0)return true;const L=LEVELS.find(l=>l.topics.some(t=>t.id===id));if(L.topics[0].id===id){const pi=LEVELS.indexOf(L)-1;return pi<0||!!P.exams[LEVELS[pi].id]}return !!P.passed[ORDER[i-1].id]}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  return {ws,due,fresh,learned};

function norm(s){return String(s).normalize('NFC').replace(/\u0301/g,'').toLowerCase().replace(/ё/g,'е').replace(/[’`´]/g,"'").replace(/[.,!?;:«»"()]/g,' ').replace(/\s+/g,' ').trim()}
const plain=s=>s;
function check(input,answer){
  const alts=String(answer).split('/').map(norm),v=norm(input);
  if(!v)return null;

  if(alts.map(plain).includes(plain(v)))return 'accent';
  return 'bad';
}

}

  $('#stat').innerHTML=`<span>🔥 <b>${streak}</b> ${plural(streak,'giorno','giorni')} di fila</span><span>Argomenti fatti: <b>${doneTopics}</b></span><span>Da ripassare: <b>${st.due}</b></span>`;

function feedback(card,x,res,given){

function wireExercises(root,list,onDone){
  root.querySelectorAll('.ex').forEach(card=>{
    const x=list[+card.dataset.i];
    const f=card.querySelector('form');
    if(f)f.onsubmit=e=>{e.preventDefault();const inp=f.querySelector('input');const r=check(inp.value,x[1]);if(!r){inp.focus();return}feedback(card,x,r,inp.value.trim());onDone()};
    const idk=card.querySelector('.idk');if(idk)idk.onclick=()=>{feedback(card,x,'bad','');onDone()};
    const bl=card.querySelector('.build');
    if(bl){const line=bl.querySelector('.line'),pool=bl.querySelector('.chips');
      bl.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||c.disabled)return;(c.parentElement===pool?line:pool).appendChild(c)});
      bl.querySelector('.bclear').onclick=()=>[...line.children].forEach(c=>pool.appendChild(c));
      bl.querySelector('.bcheck').onclick=()=>{const g=[...line.children].map(c=>c.textContent).join(' ');if(!g)return toast('Prima componi la frase');const r=check(g,x[1]);feedback(card,x,r==='bad'?'bad':'ok',g);onDone()};}
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{

}

  v.innerHTML=`<div class="wrap" style="gap:12px"><p style="margin:0;color:var(--muted)">Costruzioni pronte per esprimere i tuoi pensieri. Prima ascolta e leggi le frasi, poi componi le tue.</p>
    <div class="list">${SPEAK.map((x,i)=>{const r=P.topics['S:'+x.id];const cls=!r?'':r.best===r.total?'done':'part';return `<button class="topic" data-sp="${x.id}"><span class="num">${i+1}</span><span class="tt">${esc(x.t)} <span class="lvtag">${esc(x.lvl)}</span></span><span class="badge ${cls}">${r?r.best+' / '+r.total:x.ex.length+' ✎'}</span></button>`}).join('')}</div></div>`;
  v.querySelector('.list').onclick=e=>{const b=e.target.closest('[data-sp]');if(!b)return;route={v:'sp',id:b.dataset.sp};render();scrollTo(0,0)};
}
function renderSpeak(v){
  const x=SPEAK.find(s=>s.id===route.id);if(!x){route={v:'list'};return render()}
  const i=SPEAK.indexOf(x),next=SPEAK[i+1];
  v.innerHTML=`<div class="wrap" style="gap:14px"><button class="back" id="back">← Tutte le costruzioni</button>
    <div><span class="lvtag">${esc(x.lvl)}</span><h2>${esc(x.t)}</h2><p style="margin:4px 0 0;color:var(--muted)">${esc(x.intro||'')}</p></div>
    <h3>Costruzioni</h3>
    <div class="phr">${x.patterns.map(([a,b])=>`<div>${sayBtn(a)}<b lang="${ITA.tablesLang||'it'}">${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>
    <h3>Pratica</h3>
    <div class="exs">${x.ex.map((e,k)=>exHTML(e,k)).join('')}</div>
    <div class="score" id="score" hidden></div></div>`;
  $('#back').onclick=()=>{route={v:'list'};render()};
  const exs=v.querySelector('.exs');
  wireExercises(exs,x.ex,()=>{
    const cards=[...exs.querySelectorAll('.ex')],done=cards.filter(c=>c.dataset.done);
    if(done.length<cards.length)return;
    const good=done.filter(c=>c.dataset.done!=='bad').length,key='S:'+x.id,prev=P.topics[key];
    P.topics[key]={best:Math.max(good,prev?prev.best:0),total:cards.length,at:Date.now()};save();
    const s=$('#score');s.hidden=false;
    s.innerHTML=`${good===cards.length?winHTML():''}<strong>${good} / ${cards.length}</strong><span>${good===cards.length?'Ottimo!':'Riprova.'}</span><button class="btn ghost" id="again">Ricomincia</button>${next?`<button class="btn" id="next">Avanti: ${esc(next.t)}</button>`:''}`;
    $('#again').onclick=()=>{render();scrollTo(0,0)};
    if(next)$('#next').onclick=()=>{route={v:'sp',id:next.id};render();scrollTo(0,0)};
  });
}

/* ============ dictionary ============ */
let dictQ='',dictG=LS.get('rus.dictG','all');
const fold=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ё/g,'е');
function dictAll(){const out=[];LEVELS.forEach(l=>{l.topics.filter(t=>t.words).forEach(t=>wordsOf(deckOfTopic(t)).forEach(w=>out.push({...w,g:'L:'+l.id,gn:'Livello '+l.id+' · '+t.t})));if(l.words)wordsOf({words:l.words,prefix:l.id}).forEach(w=>out.push({...w,g:'L:'+l.id,gn:'Livello '+l.id+' · '+l.name}))});(ITA.vocab||[]).forEach(d=>wordsOf({words:d.words,prefix:'V:'+d.id}).forEach(w=>out.push({...w,g:'V:'+d.id,gn:'Vocabolario: '+d.t})));THEMES.forEach(t=>wordsOf(deckOfTheme(t)).forEach(w=>out.push({...w,g:'T:'+t.id,gn:'Tema: '+t.t})));return out}
function renderDict(v){
  const opts=[['all','Tutte le parole'],...LEVELS.map(l=>['L:'+l.id,'Livello '+l.id]),...(ITA.vocab||[]).map(d=>['V:'+d.id,'Vocabolario: '+d.t]),...THEMES.map(t=>['T:'+t.id,'Tema: '+t.t])];
  v.innerHTML=`<div class="wrap" style="gap:14px">
    <p style="margin:0;color:var(--muted)">Tutte le parole del corso con la traduzione, per livelli e per temi. Puoi cercare in russo o in italiano.</p>
    <div class="dtools"><input id="dq" type="search" placeholder="Cerca una parola…" aria-label="Cerca una parola" autocomplete="off" autocapitalize="off" spellcheck="false"><select class="decksel" id="dg" aria-label="Sezione">${opts.map(([k,n])=>`<option value="${k}" ${k===dictG?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
    <div id="dres"></div></div>`;
  const q=$('#dq');q.value=dictQ;
  const draw=()=>{
    const f=fold(dictQ.trim());let ws=dictAll();
    if(dictG!=='all')ws=ws.filter(w=>w.g===dictG);
    if(f)ws=ws.filter(w=>fold(w.it).includes(f)||fold(w.ru).includes(f));
    const groups=[];ws.forEach(w=>{let g=groups[groups.length-1];if(!g||g.k!==w.g){g={k:w.g,n:w.gn,ws:[]};groups.push(g)}g.ws.push(w)});
    $('#dres').innerHTML=`<p class="dcount" style="margin:0 0 10px">${ws.length} ${plural(ws.length,'parola','parole')}</p>`+(ws.length?groups.map(g=>`<section class="dgroup" style="margin-bottom:16px"><h3>${esc(g.n)}</h3><div class="dlist">${g.ws.map(w=>`<div class="dw">${sayBtn(w.it)||'<i></i>'}<b lang="${ITA.tablesLang||'it'}">${esc(w.it)}</b><span>${esc(w.ru)}</span></div>`).join('')}</div></section>`).join(''):'<p style="color:var(--muted)">Nessun risultato.</p>');
  };
  q.oninput=()=>{dictQ=q.value;draw()};
  $('#dg').onchange=e=>{dictG=e.target.value;LS.set('rus.dictG',dictG);draw()};
  draw();
}

/* ============ themes ============ */
function renderThemes(v){
  v.innerHTML=`<div class="wrap" style="gap:12px"><p style="margin:0;color:var(--muted)">Lezioni a tema: un testo con traduzione, frasi utili, parole per le flashcard ed esercizi. Il livello è indicativo, tutte le lezioni sono aperte.</p>
    ${[...new Set(THEMES.map(t=>t.cat||'Vita quotidiana'))].map(cat=>`<h2 class="tcat">${esc(cat)}</h2><div class="tgrid">${THEMES.filter(t=>(t.cat||'Vita quotidiana')===cat).map(t=>{const r=P.topics['T:'+t.id];const cls=!r?'':r.best===r.total?'done':'part';
      return `<button class="tcard" data-th="${t.id}"><span class="pic">${ART.themes[t.id]||''}</span><span class="tbody"><span class="lvtag">${esc(t.lvl)}</span><b>${esc(t.t)}</b><i lang="ru">${esc(t.it)}</i><span class="badge ${cls}">${r?'esercizi: '+r.best+' su '+r.total:'da iniziare'}</span></span></button>`}).join('')}</div>`).join('')}</div>`;
  v.querySelector('.wrap').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;route={v:'theme',id:b.dataset.th};render();scrollTo(0,0)};
}
function renderTheme(v){
  const t=THEMES.find(x=>x.id===route.id);if(!t){route={v:'list'};return render()}
  const words=wordsOf(deckOfTheme(t)),idx=THEMES.indexOf(t),next=THEMES[idx+1];
  v.innerHTML=`<div class="wrap" style="gap:14px">
    <button class="back" id="back">← Tutte le lezioni</button>
    ${ART.themes[t.id]?`<figure class="hero" style="margin:0">${ART.themes[t.id]}</figure>`:''}
    <div><span class="lvtag">${esc(t.lvl)}</span><h2>${esc(t.t)}</h2><i lang="ru" class="it" style="background:none;padding:0;color:var(--muted)">${esc(t.it)}</i></div>
    <h3>Testo</h3>
    <div class="reading"><div class="it-text" lang="ru">${esc(t.text)}</div>
      <div class="ru-text" id="ru" hidden>${esc(t.tr)}</div>
      <div class="row">${'speechSynthesis' in window?`<button class="btn ghost" id="read">🔊 Ascolta</button>`:''}<button class="btn ghost" id="tr">Mostra la traduzione</button></div></div>
    <h3>Frasi utili</h3>
    <div class="phr">${t.phrases.map(([a,b])=>`<div>${sayBtn(a)}<b lang="ru">${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>
    <h3>Parole (${words.length})</h3>
    <div class="words">${words.map(w=>`<div class="w${P.cards[w.key]&&P.cards[w.key].b>=4?' learned':''}"><b lang="ru">${esc(w.it)}</b><span>${esc(w.ru)}</span></div>`).join('')}</div>
    <button class="btn" id="learn" style="align-self:flex-start">Impara queste parole con le flashcard</button>
    <h3>Esercizi</h3>
    <div class="exs">${t.ex.map((x,i)=>exHTML(x,i)).join('')}</div>
    <div class="score" id="score" hidden></div></div>`;
  $('#back').onclick=()=>{route={v:'list'};render()};
  $('#tr').onclick=()=>{const r=$('#ru');r.hidden=!r.hidden;$('#tr').textContent=r.hidden?'Mostra la traduzione':'Nascondi la traduzione'};
  if($('#read'))$('#read').onclick=()=>say(t.text);
  $('#learn').onclick=()=>{P.deck='T:'+t.id;LS.set('rus.progress',P);tab='cards';LS.set('rus.tab',tab);route={v:'list'};render();scrollTo(0,0)};
  const exs=v.querySelector('.exs');
  wireExercises(exs,t.ex,()=>{
    const cards=[...exs.querySelectorAll('.ex')],done=cards.filter(c=>c.dataset.done);
    if(done.length<cards.length)return;
    const good=done.filter(c=>c.dataset.done!=='bad').length,key='T:'+t.id,prev=P.topics[key];
    P.topics[key]={best:Math.max(good,prev?prev.best:0),total:cards.length,at:Date.now()};save();
    const s=$('#score');s.hidden=false;
    s.innerHTML=`${good===cards.length?winHTML():''}<strong>${good} / ${cards.length}</strong><span>${good===cards.length?'Ottimo!':'Puoi rivedere gli errori qui sopra.'}</span><button class="btn ghost" id="again">Ricomincia</button>${next?`<button class="btn" id="next">Avanti: ${esc(next.t)}</button>`:''}`;
    $('#again').onclick=()=>{render();scrollTo(0,0)};
    if(next)$('#next').onclick=()=>{route={v:'theme',id:next.id};render();scrollTo(0,0)};
  });
}

/* ============ training ============ */
function renderTrain(v){
  const l=lvl();
  const pool=[];l.topics.filter(t=>isOpen(t.id)).forEach(t=>t.ex.forEach(x=>pool.push({x,t:t.t,id:t.id})));
  if(!pool.length){v.innerHTML=`<p style="color:var(--muted)">${lockMsg}</p>`;return}
  const pick=pool.sort(()=>Math.random()-.5).slice(0,10);
  v.innerHTML=`<div class="wrap" style="gap:12px"><p style="margin:0;color:var(--muted)">10 esercizi a caso da tutti gli argomenti del livello ${esc(l.id)}. Sopra ognuno è scritto a quale argomento appartiene.</p>
    <div class="exs">${pick.map((p,i)=>exHTML(p.x,i,p.id).replace('<div class="q">',`<div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em">${esc(p.t)}</div><div class="q">`)).join('')}</div>
    <div class="score" id="score" hidden></div></div>`;
  const exs=v.querySelector('.exs');
  wireExercises(exs,pick.map(p=>p.x),()=>{
    const cards=[...exs.querySelectorAll('.ex')],done=cards.filter(c=>c.dataset.done);
    if(done.length<cards.length)return;
    const good=done.filter(c=>c.dataset.done!=='bad').length;save();
    const s=$('#score');s.hidden=false;
    s.innerHTML=`${good===cards.length?winHTML():''}<strong>${good} / ${cards.length}</strong><span>${good===cards.length?'Nessun errore!':'Gli argomenti con errori li trovi nella scheda «Grammatica».'}</span><button class="btn" id="more">Altri 10 esercizi</button>`;
    $('#more').onclick=()=>{render();scrollTo(0,0)};
  });
}

/* ============ tastiera cirillica ============ */
const KB_ROWS=['йцукенгшщзх','фывапролджэ','ячсмитьбюъё'];
let kbOn=LS.get('rus.kb',false);
function kbHTML(){return `<div class="kb" role="group" aria-label="Tastiera cirillica">${KB_ROWS.join('').split('').map(c=>`<button type="button" data-k="${c}">${c}</button>`).join('')}<button type="button" class="wide" data-k=" ">spazio</button><button type="button" class="wide" data-k="-">-</button><button type="button" class="wide" data-k="⌫" aria-label="Cancella">⌫</button><button type="button" class="wide" data-k="⇧" aria-label="Maiuscola">⇧ Aa</button></div>`}
let kbUpper=false;
function attachKb(form){
  const inp=form.querySelector('input'),btn=form.querySelector('.kbbtn');if(!inp||!btn)return;
  const show=on=>{let k=form.querySelector('.kb');btn.setAttribute('aria-pressed',on);if(on&&!k){form.insertAdjacentHTML('beforeend',kbHTML())}else if(!on&&k)k.remove();inp.setAttribute('inputmode',on?'none':'text')};
  btn.onclick=()=>{kbOn=!kbOn;LS.set('rus.kb',kbOn);document.querySelectorAll('form.ans').forEach(f=>{if(!f.querySelector('input').disabled){const b=f.querySelector('.kbbtn');b.setAttribute('aria-pressed',kbOn);let k=f.querySelector('.kb');if(kbOn&&!k)f.insertAdjacentHTML('beforeend',kbHTML());else if(!kbOn&&k)k.remove();f.querySelector('input').setAttribute('inputmode',kbOn?'none':'text')}});inp.focus()};
  show(kbOn);
  form.addEventListener('pointerdown',e=>{if(e.target.closest('.kb button'))e.preventDefault()});
  form.addEventListener('click',e=>{const k=e.target.closest('.kb button');if(!k||inp.disabled)return;e.preventDefault();
    let ch=k.dataset.k;const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??inp.value.length;
    if(ch==='⇧'){kbUpper=!kbUpper;document.querySelectorAll('.kb button[data-k]').forEach(x=>{const c=x.dataset.k;if(c.length===1&&/[а-яё]/i.test(c))x.textContent=kbUpper?c.toUpperCase():c});return}
    if(ch==='⌫'){if(a!==b){inp.value=inp.value.slice(0,a)+inp.value.slice(b);inp.setSelectionRange(a,a)}else if(a>0){inp.value=inp.value.slice(0,a-1)+inp.value.slice(a);inp.setSelectionRange(a-1,a-1)}}
    else{if(kbUpper&&/[а-яё]/.test(ch))ch=ch.toUpperCase();inp.value=inp.value.slice(0,a)+ch+inp.value.slice(b);inp.setSelectionRange(a+ch.length,a+ch.length)}
    if(document.activeElement!==inp&&!matchMedia('(pointer:coarse)').matches)inp.focus();
  });
}
new MutationObserver(()=>{document.querySelectorAll('form.ans:not([data-kb])').forEach(f=>{f.dataset.kb='1';attachKb(f)})}).observe(document.getElementById('view'),{childList:true,subtree:true});

render();
pull();
})();
</script>
